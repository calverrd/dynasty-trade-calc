name: Update KeepTradeCut Values Daily
on:
  schedule:
    # 11:17 UTC every day (about 5:17 AM Central)
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ktc
  cancel-in-progress: false

jobs:
  update-ktc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install Playwright (Chromium) for the browser fallback
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium

      # FantasyCalc terms: cache responses and reuse them across users (each query refreshed at most every 3 hours).
      # Visitors' browsers read data/fc/ instead of calling the API. 36 GETs a day, 0.75 s apart.
      - name: Refresh the FantasyCalc cache (data/fc/)
        id: fccache
        continue-on-error: true
        run: node scripts/fetch-fc-cache.mjs

      - name: Save FantasyCalc snapshot (fc-history.json, from the cache)
        id: fc
        continue-on-error: true
        run: node scripts/update-fc.mjs

      - name: Scrape KeepTradeCut into ktc.json
        run: node scripts/update-ktc.mjs

      # Same-day ages for the comparison tool (FantasyCalc first, KTC fallback), so its age bands match the hub's
      - name: Rebuild data/player-context.json
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 scripts/build_context.py .

      # Report current rookies that KTC or FantasyCalc can't be matched to by name (log only, never fails)
      - name: Check rookie name matches
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 scripts/check_names.py .

      # Point-in-time record of every flagged player (WR BUY, Y2 JUMPED, MISSED TIME, CHEAP, PRICEY, SELL NOW/WINDOW)
      # with today's KTC, FantasyCalc and model odds, for later forward-testing. Log only; never fails the run.
      - name: Log today's signals (data/signal-log/)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 scripts/log_signals.py .

      - name: Commit and push ktc.json + history
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ktc.json ktc-history.json depth.json draft_latest.json
          if [ -f data/player-context.json ] && node -e "JSON.parse(require('fs').readFileSync('data/player-context.json','utf8'))"; then git add data/player-context.json; fi
          if [ -f fc-history.json ] && node -e "JSON.parse(require('fs').readFileSync('fc-history.json','utf8'))"; then git add fc-history.json; fi
          for f in data/signal-log/*.json; do
            if [ -f "$f" ] && node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; then git add "$f"; fi
          done
          for f in data/fc/*.json; do
            if [ -f "$f" ] && node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Data unchanged - nothing to commit."
            exit 0
          fi
          git commit -m "Update KTC/FC values $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Flag a FantasyCalc failure (after KTC data is saved)
        if: ${{ !cancelled() && (steps.fc.outcome == 'failure' || steps.fccache.outcome == 'failure') }}
        run: |
          echo "::error::FantasyCalc cache (${{ steps.fccache.outcome }}) or snapshot (${{ steps.fc.outcome }}) failed today; KTC data was still saved and any failed cache file kept yesterday's version."
          exit 1
