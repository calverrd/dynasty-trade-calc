name: Update KeepTradeCut Values Daily
on:
  schedule:
    # 11:17 UTC every day (about 5:17 AM Central)
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ktc
  cancel-in-progress: false

jobs:
  update-ktc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright (Chromium) for the browser fallback
        run: |
          npm install --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium

      - name: Scrape KeepTradeCut into ktc.json
        run: node scripts/update-ktc.mjs

      - name: Commit and push ktc.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ktc.json
          if git diff --cached --quiet; then
            echo "ktc.json unchanged - nothing to commit."
            exit 0
          fi
          git commit -m "Update KTC values $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
